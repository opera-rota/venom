name: venom

services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: venom
      POSTGRES_PASSWORD: venom
      POSTGRES_DB: venom
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=venom --dbname=venom"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
