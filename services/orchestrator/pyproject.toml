[project]
name = "venom-orchestrator"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["venom-contracts", "venom-reasoning", "starlette==1.9.0", "uvicorn==0.54.0"]

[project.scripts]
venom-brain = "venom_orchestrator.main:main"

[tool.uv.sources]
venom-contracts = { workspace = true }
venom-reasoning = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "venom_orchestrator"
