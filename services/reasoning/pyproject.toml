[project]
name = "venom-reasoning"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["venom-contracts", "anthropic==2.3.0"]

[tool.uv.sources]
venom-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "venom_reasoning"
